name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: app/go.sum

      # Catches version drift between the .exe metadata and the Arch package
      # on the PR that introduces it, rather than at release time.
      - name: Check version consistency
        run: |
          wails_version="$(sed -n 's/.*"productVersion"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' app/wails.json)"
          pkgbuild_version="$(sed -n 's/^pkgver=\(.*\)$/\1/p' app/packaging/PKGBUILD)"
          echo "wails.json=$wails_version PKGBUILD=$pkgbuild_version"
          [ "$wails_version" = "$pkgbuild_version" ]

      - name: Install WebKitGTK/GTK build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build frontend
        # go:embed all:frontend/dist requires this to exist before `go vet`
        # or `go test` can even compile the main package.
        run: |
          npm install --prefix app/frontend
          npm run build --prefix app/frontend

      - name: Check formatting
        working-directory: app
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: app
        run: go vet ./...

      # go vet on Linux never compiles the //go:build windows files, so a
      # break in the junction/reparse-point code would otherwise only show
      # up at release time.
      - name: Vet (Windows build tags)
        working-directory: app
        run: GOOS=windows GOARCH=amd64 go vet ./...

      - name: Test
        working-directory: app
        run: go test -race ./...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build (Linux)
        working-directory: app
        run: $(go env GOPATH)/bin/wails build -tags webkit2_41

  build-windows-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: app/go.sum

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Cross-compile Windows build
        working-directory: app
        run: |
          npm install --prefix frontend
          $(go env GOPATH)/bin/wails build -platform windows/amd64
