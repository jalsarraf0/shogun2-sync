name: Release

env:
  GO_VERSION: "1.25.0"
  NODE_VERSION: "22.23.2"
  NPM_VERSION: "10.9.8"
  WAILS_VERSION: "v2.13.0"
  NFPM_VERSION: "v2.47.0"
  ACTIONLINT_VERSION: "v1.7.12"

on:
  push:
    tags: ["v*"]

jobs:
  quality-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Build frontend
        working-directory: app/frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Vet
        working-directory: app
        run: go vet ./...

      - name: Test
        working-directory: app
        run: go test ./...

  release:
    needs: quality-windows
    # GitHub-hosted: org builds must not depend on a personal dominus runner.
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: app/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip cpio curl desktop-file-utils jq unzip libwebkit2gtk-4.1-dev libgtk-3-dev nsis osslsigncode rpm shellcheck zstd
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run quality gates
        run: |
          npm ci --prefix app/frontend
          npm test --prefix app/frontend
          npm run build --prefix app/frontend
          shellcheck app/packaging/*.sh
          desktop-file-validate app/packaging/shogun2sync.desktop
          go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          grep -Fq "github.com/wailsapp/wails/v2 $WAILS_VERSION" app/go.mod
          unformatted="$(gofmt -l app)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
          (cd app && go mod tidy -diff)
          (cd app && go vet ./...)
          (cd app && GOOS=windows GOARCH=amd64 go vet ./...)
          (cd app && go test -race ./...)

      - name: Build all release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          app/packaging/build-release.sh "$VERSION"

      - name: Verify installer dependencies and payloads
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          app/packaging/verify-release.sh "$VERSION"

      - name: Attest the verified release artifacts
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
