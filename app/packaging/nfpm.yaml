# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
# nfpm config for the .deb, .rpm, and Arch packages.
# `build-release.sh` builds the app and stages its verified private rclone
# runtime before invoking these commands. To package manually, do the same.
#   nfpm package --config packaging/nfpm.yaml --packager deb
#   nfpm package --config packaging/nfpm.yaml --packager rpm
#   nfpm package --config packaging/nfpm.yaml --packager archlinux
name: shogun2sync
arch: amd64
platform: linux
version: ${VERSION}
section: games
priority: optional
maintainer: shogun2-sync contributors
description: |
  Keeps Shogun 2 multiplayer campaign saves mirrored through a shared
  cloud folder, and gives you a one-click way to spot and resolve the
  duplicate files a desync leaves behind.
vendor: shogun2-sync
homepage: https://github.com/Al-Sarraf-Tech/shogun2-sync
license: MIT

# Runtime library names differ between package ecosystems. Keep these in
# overrides so each artifact asks its native package manager for real names.
overrides:
  deb:
    depends:
      - ca-certificates
      - libc6
      - libgtk-3-0t64 | libgtk-3-0
      - libwebkit2gtk-4.1-0
      - systemd
      - xdg-utils
  rpm:
    depends:
      - ca-certificates
      - glibc
      - gtk3
      - webkit2gtk4.1
      - systemd
      - xdg-utils
  archlinux:
    depends:
      - ca-certificates
      - glibc
      - gtk3
      - webkit2gtk-4.1
      - systemd
      - xdg-utils

contents:
  - src: ./build/bin/shogun2sync
    dst: /usr/bin/shogun2sync
    file_info:
      mode: 0755
  - src: ./build/bin/rclone
    dst: /usr/lib/shogun2sync/rclone
    file_info:
      mode: 0755
  - src: ./packaging/rclone-COPYING
    dst: /usr/share/licenses/shogun2sync/rclone-COPYING
    file_info:
      mode: 0644
  - src: ../LICENSE
    dst: /usr/share/licenses/shogun2sync/LICENSE
    file_info:
      mode: 0644
  - src: ./build/bin/GO-THIRD-PARTY-NOTICES.txt
    dst: /usr/share/licenses/shogun2sync/GO-THIRD-PARTY-NOTICES.txt
    file_info:
      mode: 0644
  - src: ./packaging/shogun2sync.desktop
    dst: /usr/share/applications/shogun2sync.desktop
  - src: ./packaging/appicon-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/shogun2sync.png
